<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <aside>
        <h2><img src="icons/view-dashboard.svg" alt="dashboard" />Dashboard</h2>

        <nav>
          <ul>
            <li><img src="icons/home.svg" alt="home" />Home</li>
            <li>
              <img src="icons/card-account-details.svg" alt="profile" />Profile
            </li>
            <li><img src="icons/message-reply.svg" alt="message" />Messages</li>
            <li>
              <img src="icons/clock-time-three.svg" alt="history" />History
            </li>
            <li>
              <img src="icons/text-box-multiple-outline.svg" alt="tasks" />Tasks
            </li>
            <li>
              <img src="icons/account-group.svg" alt="communities" />Communities
            </li>
          </ul>
        </nav>

        <nav>
          <ul>
            <li><img src="icons/cog.svg" alt="settings" />Settings</li>
            <li><img src="icons/help-box.svg" alt="support" />Support</li>
            <li><img src="icons/shield-check.svg" alt="privacy" />Privacy</li>
          </ul>
        </nav>
      </aside>

      <main>
        <header>
          <div class="head-1">
            <div>
              <img src="icons/magnify.svg" alt="search" />
              <input type="text" />
            </div>

            <div>
              <img src="icons/bell-ring.svg" alt="notifications" />
              <img src="images/profile_pic.jpg" alt="profile picture" />
              Morgan Oakely
            </div>
          </div>

          <div class="head-2">
            <div>
              <img src="images/profile_pic.jpg" alt="profile picture" />
              <p>
                <span>Hi there,</span><br />
                Morgan Oakley(@morgan)
              </p>
            </div>

            <div>
              <button>New</button>
              <button>Upload</button>
              <button>Share</button>
            </div>
          </div>
        </header>

        <main></main>
      </main>
    </div>
  </body>
</html>
